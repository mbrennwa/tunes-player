<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon for Tunes (#184).
  Tile depth follows the Post app icon: darker front plate, top face,
  rim highlight, and a glyph contact shadow. No outer tile shadow, so
  GNOME can apply contextual shadows.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ea62ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <filter id="glyphShadow" x="-30%" y="-20%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2.7" stdDeviation="1.15" flood-color="#1a1848" flood-opacity=".62"/>
    </filter>
  </defs>

  <!-- Darker front plate; top face sits a few pixels above it -->
  <rect x="12" y="14" width="104" height="104" rx="22" fill="#123a78"/>
  <rect x="12" y="10" width="104" height="104" rx="22" fill="url(#tile)"/>
  <path d="M34 11 H94 Q111 11 115 29" fill="none" stroke="#ffb0f6" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <!-- Original open speaker stroke -->
  <g filter="url(#glyphShadow)">
    <path fill="none" stroke="#ffffff" stroke-width="10.2" stroke-linecap="round" stroke-linejoin="round" d="M 86.149,95.812 61.781,75.005 H 41.851 V 48.995 H 61.781 L 86.149,28.188"/>
  </g>
</svg>
