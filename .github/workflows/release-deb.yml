# Build a .deb on version tags and attach it to the matching GitHub Release.
# Tag must match pyproject.toml (e.g. version 0.1.dev0 → tag v0.1.dev0).

name: Release DEB

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts python3 python3-venv python3-pip

      - name: Build .deb package
        env:
          DEBEMAIL: mbrennwa@gmail.com
          DEBFULLNAME: Matthias Brennwald
        run: ./tools/build-deb.sh

      - name: Set pre-release flag for .dev versions
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if echo "$VERSION" | grep -qE '\.dev[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with .deb
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/tunes-player_*_all.deb
