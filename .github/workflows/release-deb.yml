# Build a .deb on version tags and attach it to the matching GitHub Release.
# Tag must match pyproject.toml (e.g. version 1.0.0a1 → tag v1.0.0a1).

name: Release DEB

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper devscripts fakeroot build-essential \
            python3 python3-venv python3-pip librsvg2-bin
          sudo apt-get satisfy -y "debhelper-compat (= 13)" || true

      - name: Build .deb package
        env:
          DEBEMAIL: mbrennwa@gmail.com
          DEBFULLNAME: Matthias Brennwald
        run: |
          set -euxo pipefail
          ./tools/build-deb.sh
          test -n "$(find dist -maxdepth 1 -name 'tunes-player_*_all.deb' -print -quit)"

      - name: Set pre-release flag for alpha/beta/rc and legacy .dev versions
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if echo "$VERSION" | grep -qE '(\.dev|a|b|rc)[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with .deb
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/tunes-player_*_all.deb
