[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunes-player"
version = "1.0.dev1"
description = "Tunes — music player for local files and streaming (Tidal, Deezer, Qobuz; Linux/GNOME first)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "mbrennwa" }]
keywords = ["music", "player", "gtk", "gnome", "audio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "platformdirs>=4.0",
    "mutagen>=1.47",
    "python-mpv>=1.0.8",
    "tidalapi>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[project.scripts]
tunes-player = "tunes_player.__main__:main"

[project.urls]
Homepage = "https://github.com/mbrennwa/tunes-player"
Repository = "https://github.com/mbrennwa/tunes-player"
Issues = "https://github.com/mbrennwa/tunes-player/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tunes_player*"]

[tool.setuptools.package-data]
tunes_player = ["ui/gtk/*.css"]

[tool.deb]
# Debian/Ubuntu packages provided by the distro (not PyPI).
# The install-time venv uses --system-site-packages; the app is installed with
# pip --no-index --no-deps from the shipped wheelhouse.
apt_depends = [
  "python3 (>= 3.11)",
  "python3-venv",
  "python3-gi",
  "python3-gi-cairo",
  "gir1.2-gtk-4.0",
  "gir1.2-adw-1",
  "mpv",
  "libmpv2",
  "python3-mutagen",
  "python3-platformdirs",
]
# Packages vendored as wheels in the .deb (built at package build time).
pypi_wheelhouse = [
  "tidalapi",
  "python-mpv",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
filterwarnings = [
    "ignore:GLib.unix_signal_add_full is deprecated; use GLibUnix.signal_add_full instead:gi.PyGIDeprecationWarning",
]
markers = [
    "integration: requires ALSA loopback, mpv, and arecord",
]

[tool.ruff]
line-length = 100
target-version = "py311"
